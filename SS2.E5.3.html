<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mua xe</title>
</head>
<body>
    <h1>Car Purchase Form</h1>
    <form>
        <label>Name:</label>
        <input type="text">
       <br><br>
        <label>Email:</label>
        <input type="text">
       <br><br>
        <label>Phone:</label>
        <input type="text">
       <br><br>
        <label>Choose a Car:</label>
        <select>
            <option>Model 1</option>
            <option>Model 2</option>
            <option>Model 3</option>
        </select>
       <br><br>
        <label>Choose a Color:</label>
        <select>
            <option>Red</option>
            <option>Green</option>
            <option>Blue</option>
        </select>
       <br><br>
        <label>Quantity:</label>
        <input type="text">
       <br><br>
        <label>Delivery Date:</label>
        <input type="date"> 
       <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
